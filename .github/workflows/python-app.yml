name: Sync Stock Data From Scanner Repo

on:
  schedule:
    # Every 30 minutes from 03:30 to 10:30 UTC (9 AM – 4 PM IST)
    - cron: "30 3 * * 1-5"
    - cron: "0,30 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout destination repo (GEOTRADER)
      - name: 📥 Checkout GEOTRADER
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Checkout source repo inside temporary folder
      - name: 📥 Checkout Stock Scanner Repo
        uses: actions/checkout@v4
        with:
          repository: EGAVSIV/Stock_Scanner_With_ASTA_Parameters
          path: source_repo

      # 3. Copy required folders
      - name: 📂 Copy Stock Data Folders
        run: |
          rm -rf stock_data_15 stock_data_1H stock_data_D stock_data_M stock_data_W

          cp -r source_repo/stock_data_15 .
          cp -r source_repo/stock_data_1H .
          cp -r source_repo/stock_data_D .
          cp -r source_repo/stock_data_M .
          cp -r source_repo/stock_data_W .

      # 4. Remove the temporary source repository folder to keep Git clean
      - name: 🧹 Clean up Temporary Source Directory
        run: rm -rf source_repo

      # 5. Safe Commit and Push with Rebase
      - name: 📤 Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add stock_data_15 stock_data_1H stock_data_D stock_data_M stock_data_W

          # Check if there are staged changes before attempting to commit
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Auto Sync Stock Data from Scanner Repo"
            git pull --rebase origin main
            git push
          else
            echo "No data changes detected. Skipping push."
          fi
