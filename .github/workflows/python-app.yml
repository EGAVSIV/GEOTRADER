name: Market Data Collector

on:
  workflow_dispatch:        # Manual Run Button
  schedule:
    - cron: "30 10 * * 1-5"   # 10:30 UTC (4:00 PM IST) Mon-Fri

permissions:
  contents: write   # IMPORTANT: Allows push back to repo

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Data Collector
        run: |
          python Datacopier.py

      - name: 📤 Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .
          git commit -m "📊 Auto updated market data" || echo "No changes to commit"
          git push
